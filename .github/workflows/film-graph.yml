name: Film Data Query CI

on:
  push:
    branches: [main, film-graph-demo]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generated GraphQL types are up to date
        run: |
          npm run filmgraph:codegen
          git diff --exit-code -- src/filmgraph/api/generated.ts

      - name: Typecheck
        run: npm run filmgraph:typecheck

      - name: Unit tests (data layer, resolvers, REST)
        run: npm run test:unit

      - name: Contract tests (GraphQL and REST return the same data)
        run: npm run test:contract

      - name: Seed size budget
        run: npm run filmgraph:check-seed

      - name: Build the site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
